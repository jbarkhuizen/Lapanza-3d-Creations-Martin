<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapanza Admin — Product Catalog</title>
  <meta name="theme-color" content="#f7f3eb" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Fraunces:opsz,wght@9..144,500..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div id="app">
    <!-- Login -->
    <section id="view-login" class="login-screen hidden">
      <div class="login-card">
        <p class="eyebrow">Lapanza 3D</p>
        <h1>Admin portal</h1>
        <p class="muted">Manage filament, category pages, colours, specs and catalog items.</p>
        <form id="login-form" class="stack gap-3">
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" required autocomplete="current-password" placeholder="Enter admin password" />
          </label>
          <button type="submit" class="btn btn-primary">Sign in</button>
          <p id="login-error" class="error hidden"></p>
          <p class="hint">Default password: <code>lapanza-admin</code></p>
        </form>
      </div>
    </section>

    <!-- Shell -->
    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">Lapanza <em>Admin</em></span>
          <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
            <span class="theme-icon sun" aria-hidden="true">☀</span>
            <span class="theme-icon moon" aria-hidden="true">☾</span>
          </button>
        </div>
        <nav class="sidebar-nav">
          <p class="nav-group-label">Client Side</p>
          <button class="nav-btn active" data-route="dashboard">Dashboard</button>
          <button class="nav-btn" data-route="catalog">Product catalog</button>
          <button class="nav-btn" data-route="orders">Orders</button>
          <button class="nav-btn" data-route="new-order">+ New order</button>
          <button class="nav-btn" data-route="clients">Clients</button>
          <button class="nav-btn" data-route="registered-users">Registered users</button>
          <button class="nav-btn" data-route="design-requests">Design requests</button>
          <button class="nav-btn" data-route="invoice-history">Invoice History</button>
          <button class="nav-btn" data-route="resources">3D Resources</button>
          <button class="nav-btn" data-route="shipping">Shipping options</button>
          <button class="nav-btn" data-route="newsletter">Newsletter</button>
          <button class="nav-btn" data-route="whatsapp-updates">WhatsApp Updates</button>

          <hr class="nav-divider" />
          <p class="nav-group-label">Local Management</p>
          <button class="nav-btn" data-route="stock">Stock management</button>
          <button class="nav-btn" data-route="in-house-filament">In-House Filament</button>
          <button class="nav-btn" data-route="print-jobs">Print Job Costing</button>
          <button class="nav-btn" data-route="purchases">Purchase History</button>

          <hr class="nav-divider" />
          <p class="nav-group-label">Settings</p>
          <button class="nav-btn" data-route="backups">Backups</button>
          <button class="nav-btn" data-route="settings">Site settings</button>
        </nav>
        <div class="sidebar-foot">
          <button id="btn-publish" class="btn btn-ghost full" type="button">Publish to site</button>
          <button id="btn-logout" class="btn btn-ghost full" type="button">Sign out</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="top-eyebrow">Overview</p>
            <h2 id="top-title">Dashboard</h2>
          </div>
          <div class="topbar-actions">
            <button id="btn-new-filament" class="btn btn-primary" type="button">+ Filament</button>
            <button id="btn-new-category" class="btn btn-secondary" type="button">+ Category</button>
          </div>
        </header>

        <div id="view-dashboard" class="view"></div>
        <div id="view-catalog" class="view hidden"></div>
        <div id="view-editor" class="view hidden"></div>
        <div id="view-orders" class="view hidden"></div>
        <div id="view-order-detail" class="view hidden"></div>
        <div id="view-clients" class="view hidden"></div>
        <div id="view-registered-users" class="view hidden"></div>
        <div id="view-shipping" class="view hidden"></div>
        <div id="view-stock" class="view hidden"></div>
        <div id="view-resources" class="view hidden"></div>
        <div id="view-design-requests" class="view hidden"></div>
        <div id="view-newsletter" class="view hidden"></div>
        <div id="view-whatsapp-updates" class="view hidden"></div>
        <div id="view-new-order" class="view hidden"></div>
        <div id="view-invoice-history" class="view hidden"></div>
        <div id="view-purchases" class="view hidden"></div>
        <div id="view-print-jobs" class="view hidden"></div>
        <div id="view-in-house-filament" class="view hidden"></div>
        <div id="view-backups" class="view hidden"></div>
        <div id="view-settings" class="view hidden"></div>
      </main>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
