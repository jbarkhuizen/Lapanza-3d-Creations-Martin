# Lapanza 3D — gzip compression (Backlog #104/#107 performance pass).
# Install to /etc/nginx/conf.d/gzip.conf (http context), then:
#   sudo nginx -t && sudo systemctl reload nginx
# Before this, ALL responses were served uncompressed — the 518KB homepage
# JS chunk went over the wire at full size (measured 2026-08-31).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/javascript text/css application/json image/svg+xml text/plain application/xml text/xml;
