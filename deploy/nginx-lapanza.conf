# nginx site config for Lapanza 3D on a single VPS.
# Serves the built static site directly; proxies /api, /admin, /uploads to
# the Node backend (systemd service "lapanza-admin", bound to 127.0.0.1:8787).
#
# EDIT server_name below to your real domain before deploying.
# After this is live over plain HTTP, run:
#   sudo certbot --nginx -d lapanza3d.co.za -d www.lapanza3d.co.za
# certbot rewrites this file to add the HTTPS server block + auto-redirect.

server {
    listen 80;
    listen [::]:80;
    server_name lapanza3d.co.za www.lapanza3d.co.za;

    root /opt/lapanza/app/dist;
    index index.html;

    client_max_body_size 50m; # must cover the 50MB design-request/print-job upload limit in server/uploads.js -- at 25m a 26-50MB upload died as an opaque nginx HTML 413

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames under /assets/, so aggressive
    # immutable caching is safe -- a new build means new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Branded 404 (self-contained HTML, safe at any URL depth) instead of
    # nginx's bare default error page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
