name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 requires Node >=22 -- see docs/DEPLOY.md's note on
          # this (Node 20 "succeeds" with a warning, then segfaults at runtime).
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      # #115: browser-level smoke pack -- real built site + real backend
      # with a scratch DB. Runs after build since vite preview serves dist/.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
