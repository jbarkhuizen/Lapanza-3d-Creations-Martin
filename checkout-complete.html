<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order placed — Lapanza 3D Creative Lab</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function(){try{var t=localStorage.getItem('lapanza-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<script>window.__PAGE_DEPTH__=0;window.__PAGE_PATH__="checkout-complete.html";</script>
<script type="module" src="src/js/checkout-complete-entry.js"></script>
</head>
<body class="font-sans antialiased">
  <main class="min-h-screen flex items-center justify-center px-6 text-center">
    <div class="max-w-md">
      <p class="eyebrow mb-3">Thank you</p>
      <h1 class="font-serif text-4xl tracking-[-0.03em] mb-4">Order Received</h1>
      <p class="text-espresso/70 mb-2">We're confirming your payment with Payfast now. You'll get an email confirmation shortly.</p>
      <p class="text-espresso/50 text-sm mb-8" id="order-ref"></p>
      <a href="index.html" class="inline-flex text-sm font-semibold bg-charcoal text-cream rounded-full px-5 py-2.5 hover:bg-terracotta transition-colors">Back to shop</a>
    </div>
  </main>
</body>
</html>
